<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar PC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #canvas { display: block; cursor: default; }

    /* Status overlay */
    .status {
      position: fixed; bottom: 40px; left: 0; right: 0;
      text-align: center; color: rgba(255,255,255,0.7);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 16px; pointer-events: none;
      transition: opacity 0.3s;
    }
    .status.hidden { opacity: 0; }

    /* Subtitle bar */
    .subtitle {
      position: fixed; bottom: 80px; left: 10%; right: 10%;
      text-align: center; color: rgba(255,255,255,0.85);
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 20px; pointer-events: none;
      text-shadow: 0 0 8px rgba(0,0,0,0.5);
      transition: opacity 0.3s;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .subtitle.hidden { opacity: 0; }

    /* Click anywhere */
    .tap-hint {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.25); font-size: 14px; pointer-events: none;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }

    /* Loading overlay */
    .loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.6); font-size: 18px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="loading" id="loading">加载中...</div>
  <div class="tap-hint" id="tapHint" style="display:none">点击屏幕开始对话</div>
  <div class="subtitle hidden" id="subtitle"></div>
  <div class="status" id="status"></div>

  <!-- All JS loaded locally (no CDN, for air-gapped deployment) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js",
      "three/addons/": "./js/addons/",
      "@pixiv/three-vrm": "./js/three-vrm.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    // ─── Globals ────────────────────────────────────────────
    let vrm = null;           // current VRM model
    let clock = new THREE.Clock();
    let currentMode = 'idle';
    let currentEmotion = 'neutral';
    let isSpeaking = false;
    let responseText = '';

    // Viseme state (for smooth lerp)
    // VRM1 uses: aa, ih, ou, ee, oh (not A/I/U/E/O)
    let visemeTargets = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let visemeCurrent = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let visemeBlendSpeed = 8.0; // how fast visemes transition

    // Blink state
    let blinkTimer = 0;
    let blinkInterval = 3.0;    // seconds between blinks
    let blinkValue = 0;
    let isBlinking = false;

    // Idle micro-movement
    let idleTime = 0;

    // Avatar base transform (user-dragged) + drag state.
    // Idle breathing/sway is layered on top of avatarBaseY, so dragging and
    // idle animation don't fight each other.
    const avatarBase = { x: 0, y: -0.95 };
    // Measured avatar extents (world units) relative to the avatar's root —
    // the position that avatarBase controls. Populated by fitWindowToAvatar()
    // once the model's bounding box is known. These fallbacks match the old
    // hardcoded guesses until the model is loaded.
    const avatarBounds = { halfW: 0.55, top: 0.95, bottom: 0.0, centerX: 0,
                             worldW: 1.1, worldH: 1.7, worldCenter: new THREE.Vector3(0, 0.85, 0) };
    let dragAvatar = null; // { plane, offset, prevX, prevY, avatarObj } while dragging the avatar

    // Keyboard movement state — WASD + arrow keys.
    const keys = { left: false, right: false, up: false, down: false };
    const moveSpeed = 0.4; // world units per second

    // ─── Three.js Setup ─────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.setClearColor(0x000000, 0); // transparent — desktop shows through

    const scene = new THREE.Scene();
    // No background or fog — transparent.

    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 50);
    // Initial camera position — will be recomputed by fitWindowToAvatar() once
    // the avatar is loaded so the entire body (including legs) is visible.
    camera.position.set(0, 0.9, 3.5);
    camera.lookAt(0, 0.7, 0);

    // ─── Lighting ───────────────────────────────────────────
    // Ambient
    scene.add(new THREE.AmbientLight('#ffffff', 1.2));

    // Key light (warm)
    const keyLight = new THREE.DirectionalLight('#fff5e6', 3.5);
    keyLight.position.set(1.5, 2.5, 2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 20;
    scene.add(keyLight);

    // Fill light (cool)
    const fillLight = new THREE.DirectionalLight('#d0e8ff', 1.5);
    fillLight.position.set(-1, 0.5, -1);
    scene.add(fillLight);

    // Rim light
    const rimLight = new THREE.DirectionalLight('#ffffff', 2.0);
    rimLight.position.set(0, 0.2, -2);
    scene.add(rimLight);

    // ─── Ground plane ───────────────────────────────────────
    // (Removed — no ground plane, so the transparent background
    //  shows the Windows desktop behind the avatar.)

    // ─── Load VRM ───────────────────────────────────────────
    async function loadVRM(url) {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      const gltf = await loader.loadAsync(url);
      vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      VRMUtils.rotateVRM0(vrm);

      scene.add(vrm.scene);
      vrm.scene.position.set(0, -0.95, 0);

      // Set arms to natural hanging pose (T-pose → arms down)
      setArmPose();

      console.log('VRM loaded:', vrm.meta?.metaVersion);
      console.log('Expressions:', Object.keys(vrm.expressionManager?.expressionMap || {}));
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tapHint').style.display = 'block';
      updateStatus();

      // Auto-fit the window to the avatar's bounding box so the entire body
      // (including legs) is visible.
      setTimeout(fitWindowToAvatar, 100);
    }

    // Rotate upper arms from T-pose (arms horizontal) to a natural hanging pose.
    function setArmPose() {
      if (!vrm?.humanoid) return;

      const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
      const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');

      // In the T-pose the arms extend horizontally along ±X (up = +Y, forward = +Z).
      // A rotation around the Z axis swings the arm in the vertical (XY) plane.
      //   left arm points +X → -90° about Z brings it down to -Y.
      //   right arm points -X → +90° about Z brings it down to -Y.
      // To splay the arms OUTWARD (away from the body midline) so the hands
      // aren't hidden behind the torso, subtract the outward angle from the
      // "down" rotation: left -90°+out moves toward +X (its own side),
      // right +90°-out moves toward -X (its own side).
      const armDown = Math.PI / 2;      // 90° down from horizontal
      const armOut = 0.22;              // outward splay (~12.6°)

      if (leftUpperArm) {
        leftUpperArm.rotation.set(0, 0, -(armDown - armOut));
      }
      if (rightUpperArm) {
        rightUpperArm.rotation.set(0, 0, armDown - armOut);
      }
    }

    // ─── Try to load a local VRM model, fallback to a simple placeholder ──
    async function initAvatar() {
      try {
        // Try loading a VRM model from the models/ directory.
        await loadVRM('/models/avatar.vrm');
      } catch (err) {
        console.error('VRM load failed:', err.message, err.stack);
        console.warn('Falling back to placeholder avatar...');
        createPlaceholderAvatar();
      }
    }

    // ─── Placeholder avatar (simple geometric character) ────
    function createPlaceholderAvatar() {
      const group = new THREE.Group();

      // Body (torso)
      const bodyGeo = new THREE.CapsuleGeometry(0.22, 0.5, 8, 16);
      const bodyMat = new THREE.MeshStandardMaterial({ color: '#4a6fa5', roughness: 0.3 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.75;
      body.castShadow = true;
      group.add(body);

      // Head
      const headGroup = new THREE.Group();
      headGroup.position.y = 1.25;

      const headGeo = new THREE.SphereGeometry(0.2, 32, 32);
      const headMat = new THREE.MeshStandardMaterial({ color: '#f5e6d3', roughness: 0.4 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.castShadow = true;
      headGroup.add(head);

      // Eyes
      const eyeGeo = new THREE.SphereGeometry(0.045, 16, 16);
      const eyeMat = new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.1 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.07, 0.04, -0.17);
      headGroup.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.07, 0.04, -0.17);
      headGroup.add(rightEye);

      // Mouth
      const mouthGeo = new THREE.BoxGeometry(0.1, 0.02, 0.01);
      const mouthMat = new THREE.MeshStandardMaterial({ color: '#cc4444', roughness: 0.3 });
      const mouth = new THREE.Mesh(mouthGeo, mouthMat);
      mouth.position.set(0, -0.06, -0.18);
      mouth.name = 'mouth';
      headGroup.add(mouth);

      group.add(headGroup);
      group.position.set(0, -0.95, 0);
      scene.add(group);

      // Store references for animation
      window._placeholder = { group, headGroup, mouth, leftEye, rightEye };

      console.log('Placeholder avatar created');
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tapHint').style.display = 'block';
      updateStatus();

      // Auto-fit the window to the avatar's bounding box.
      setTimeout(fitWindowToAvatar, 100);
    }

    // ─── Auto-fit window to avatar bounding box ─────────────────
    // Measures the avatar's bounding box, then resizes the window so the
    // avatar's on-screen height equals half the screen height.  The window
    // aspect ratio matches the avatar's width/height ratio.
    function fitWindowToAvatar() {
      const box = new THREE.Box3();
      scene.traverse((obj) => {
        if (!obj.isMesh) return;
        box.expandByObject(obj);
      });
      if (box.isEmpty()) return;

      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      console.log('avatar world bbox:', size.x.toFixed(2), 'x', size.y.toFixed(2),
                  'center:', center.x.toFixed(2), center.y.toFixed(2), center.z.toFixed(2));

      // Store root-relative extents for clampAvatarBase.
      const top = center.y + size.y / 2;
      const bottom = center.y - size.y / 2;
      avatarBounds.halfW = size.x / 2;
      avatarBounds.top = top - avatarBase.y;
      avatarBounds.bottom = bottom - avatarBase.y;
      avatarBounds.centerX = center.x - avatarBase.x;
      avatarBounds.worldW = size.x;
      avatarBounds.worldH = size.y;
      avatarBounds.worldCenter.copy(center);
      console.log('avatarBounds (root-relative): halfW:', avatarBounds.halfW.toFixed(2),
                  'top:', avatarBounds.top.toFixed(2), 'bottom:', avatarBounds.bottom.toFixed(2),
                  'centerX:', avatarBounds.centerX.toFixed(2));

      // Target: avatar height = half the screen height.
      // The window height is set to the target avatar pixel height; the
      // camera fit (fitCameraToWindow) adds a small margin internally so
      // the avatar doesn't touch the window edges.
      const targetPxH = Math.round(screen.height * 0.5);
      const winH = targetPxH;
      const aspect = size.x / size.y;
      const winW = Math.round(winH * aspect);

      console.log('fitWindowToAvatar: target px height:', targetPxH,
                  'window:', winW, 'x', winH);

      // Tell Go to resize + center the window, then fit the camera.
      if (window.goBridge_setWindowSize) {
        window.goBridge_setWindowSize(winW, winH);
      }
      // Defer camera fit to next frame — the window may not have resized yet.
      setTimeout(fitCameraToWindow, 50);
    }

    // Adjusts the camera distance so the avatar fills the current window,
    // keeping the same margin. Called on resize and after initial window fit.
    function fitCameraToWindow() {
      if (!avatarBounds.worldH) return;

      const margin = 1.02;
      const fovRad = camera.fov * Math.PI / 180;

      const distH = (avatarBounds.worldW * margin) / (2 * Math.tan(fovRad / 2) * camera.aspect);
      const distV = (avatarBounds.worldH * margin) / (2 * Math.tan(fovRad / 2));
      const dist = Math.max(distH, distV);

      const center = avatarBounds.worldCenter;
      camera.position.set(center.x, center.y, dist);
      camera.lookAt(center.x, center.y, center.z);
      camera.near = Math.max(0.01, dist * 0.1);
      camera.updateProjectionMatrix();

      console.log('fitCameraToWindow: dist:', dist.toFixed(1),
                  'pos:', camera.position.x.toFixed(2), camera.position.y.toFixed(2));
    }

    // ─── Animation Loop ─────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      idleTime += dt;

      if (vrm) {
        // Update VRM
        updateVRMBlink(dt);
        updateVRMVisemes(dt);
        updateVRMIdleMicro(dt);
        updateKeyboardMove(dt);

        // VRM needs to be updated each frame for expressions to apply
        vrm.update(dt);
      } else if (window._placeholder) {
        updatePlaceholderBlink(dt);
        updatePlaceholderMouth(dt);
        updatePlaceholderIdle(dt);
        updateKeyboardMove(dt);
      }

      renderer.render(scene, camera);
    }

    // ─── VRM: Blink ─────────────────────────────────────────
    function updateVRMBlink(dt) {
      blinkTimer += dt;

      if (!isBlinking && blinkTimer > blinkInterval) {
        isBlinking = true;
        blinkTimer = 0;
        blinkInterval = 2.5 + Math.random() * 4.0;
        blinkValue = 0;
      }

      if (isBlinking) {
        blinkValue += dt * 12; // fast close
        if (blinkValue >= 1.0) {
          blinkValue = 1.0;
          // hold briefly then open
          blinkTimer += dt;
          if (blinkTimer > 0.12) {
            blinkValue -= dt * 12;
            if (blinkValue <= 0) {
              blinkValue = 0;
              isBlinking = false;
              blinkTimer = 0;
            }
          }
        }
      }

      // Apply blink (VRM1 preset name is 'blink')
      if (vrm.expressionManager && blinkValue > 0.001) {
        vrm.expressionManager.setValue('blink', blinkValue);
      }
    }

    // ─── VRM: Viseme (lip-sync) ─────────────────────────────
    function updateVRMVisemes(dt) {
      if (!vrm?.expressionManager) return;

      const visemeNames = ['aa', 'ih', 'ou', 'ee', 'oh'];
      const lerp = Math.min(visemeBlendSpeed * dt, 1.0);

      for (const name of visemeNames) {
        visemeCurrent[name] += (visemeTargets[name] - visemeCurrent[name]) * lerp;
        vrm.expressionManager.setValue(name, visemeCurrent[name]);
      }
    }

    // ─── VRM: Idle micro-movement ───────────────────────────
    function updateVRMIdleMicro(dt) {
      if (currentMode !== 'idle') return;
      if (!vrm?.scene) return;

      const t = idleTime;
      // Subtle breathing (layered on top of avatarBase.y)
      const breathe = Math.sin(t * 1.4) * 0.008;
      vrm.scene.position.y = avatarBase.y + (dragAvatar ? 0 : breathe);
      // Subtle side-to-side sway
      vrm.scene.position.x = avatarBase.x + (dragAvatar ? 0 : Math.sin(t * 0.7) * 0.015);
      vrm.scene.rotation.z = Math.sin(t * 0.7) * 0.015;
      vrm.scene.rotation.y = Math.sin(t * 0.5) * 0.02;
    }

    // ─── Placeholder: Blink ─────────────────────────────────
    let placeholderBlink = 0;
    let placeholderBlinking = false;
    let placeholderBlinkTimer = 0;

    function updatePlaceholderBlink(dt) {
      const { leftEye, rightEye } = window._placeholder;
      placeholderBlinkTimer += dt;
      const blinkInterval = 3.0;

      if (!placeholderBlinking && placeholderBlinkTimer > blinkInterval) {
        placeholderBlinking = true;
        placeholderBlink = 0;
      }

      if (placeholderBlinking) {
        placeholderBlink += dt * 10;
        if (placeholderBlink >= 1.0) {
          placeholderBlinkTimer += dt;
          if (placeholderBlinkTimer > 0.15) {
            placeholderBlink -= dt * 10;
            if (placeholderBlink <= 0) {
              placeholderBlink = 0;
              placeholderBlinking = false;
              placeholderBlinkTimer = 0;
            }
          }
        }
      }

      const eyeScale = 1 - placeholderBlink * 0.9;
      leftEye.scale.y = eyeScale;
      rightEye.scale.y = eyeScale;
    }

    // ─── Placeholder: Mouth (speaking) ───────────────────────
    let placeholderMouthTime = 0;
    function updatePlaceholderMouth(dt) {
      const { mouth } = window._placeholder;
      if (!mouth) return;

      if (isSpeaking) {
        placeholderMouthTime += dt;
        // Simple oscillating mouth open/close while speaking
        const openness = 0.5 + 0.5 * Math.sin(placeholderMouthTime * 12);
        mouth.scale.y = 0.3 + openness * 8;
        mouth.position.y = -0.06 - openness * 0.04;
      } else {
        mouth.scale.y = 0.3;
        mouth.position.y = -0.06;
      }
    }

    // ─── Placeholder: Idle sway ──────────────────────────────
    function updatePlaceholderIdle(dt) {
      if (currentMode !== 'idle') return;
      const { group } = window._placeholder;
      if (!group) return;
      const t = idleTime;
      group.position.y = avatarBase.y + (dragAvatar ? 0 : Math.sin(t * 1.4) * 0.005);
      group.position.x = avatarBase.x + (dragAvatar ? 0 : Math.sin(t * 0.7) * 0.01);
      group.rotation.z = Math.sin(t * 0.7) * 0.01;
    }

    // ─── Status UI ──────────────────────────────────────────
    function updateStatus() {
      const el = document.getElementById('status');
      const sub = document.getElementById('subtitle');
      const hint = document.getElementById('tapHint');

      switch (currentMode) {
        case 'idle':
          el.textContent = '';
          sub.classList.add('hidden');
          hint.style.display = 'block';
          break;
        case 'listening':
          el.textContent = '聆听中...';
          sub.classList.add('hidden');
          hint.style.display = 'none';
          break;
        case 'thinking':
          el.textContent = '思考中...';
          sub.classList.add('hidden');
          hint.style.display = 'none';
          break;
        case 'speaking':
          el.textContent = '';
          sub.textContent = responseText || '';
          sub.classList.remove('hidden');
          hint.style.display = 'none';
          break;
      }
    }

    // ─── JS Bridge: Receive messages from Go ─────────────────
    // Called by Go via Eval: handleMessage(jsonString)
    window.handleMessage = function(jsonStr) {
      try {
        const msg = JSON.parse(jsonStr);
        if (msg.type === 'viseme') {
          // Viseme lip-sync message
          applyViseme(msg.viseme, msg.weight);
          return;
        }
        if (msg.mode) {
          currentMode = msg.mode;
          isSpeaking = msg.isSpeaking || false;
          responseText = msg.responseText || '';
          if (msg.emotion) currentEmotion = msg.emotion;
          updateStatus();
          applyModeToVRM();
        }
      } catch (e) {
        console.error('handleMessage error:', e);
      }
    };

    // ─── Apply a single viseme to the VRM model ──────────────
    function applyViseme(viseme, weight) {
      if (!vrm?.expressionManager) return;

      // VRM1 mouth visemes: aa, ih, ou, ee, oh
      const mouthVisemes = ['aa', 'ih', 'ou', 'ee', 'oh'];

      if (viseme === 'rest' || !viseme) {
        // Reset all visemes (closed mouth).
        for (const name of mouthVisemes) {
          visemeTargets[name] = 0;
        }
        return;
      }

      // Set the target viseme to the given weight, others to 0.
      for (const name of mouthVisemes) {
        visemeTargets[name] = (name === viseme) ? weight : 0;
      }
    }

    // ─── Apply mode/emotion/speaking state to VRM ──────────────
    function applyModeToVRM() {
      if (!vrm?.expressionManager) return;

      // Reset all preset expressions to neutral
      const presets = ['happy', 'angry', 'sad', 'surprised', 'relaxed', 'neutral'];
      for (const p of presets) {
        vrm.expressionManager.setValue(p, 0);
      }

      // Apply emotion
      if (currentEmotion !== 'neutral' && presets.includes(currentEmotion)) {
        vrm.expressionManager.setValue(currentEmotion, 1.0);
      }

      // Visemes are driven by real-time viseme messages from Go,
      // not by the mode/emotion state. When not speaking, reset
      // the mouth to closed.
      if (!isSpeaking) {
        applyViseme('rest', 0);
      }
    }

    // ─── JS Bridge: Send events to Go ───────────────────────
    function sendEvent(type, data) {
      const msg = JSON.stringify({ type, data });
      // WebView2 bridge (bound by renderer_windows.go via w.Bind).
      if (window.goBridge_sendEvent) {
        window.goBridge_sendEvent(msg);
      }
      console.log('sendEvent:', type, data);
    }

    // ─── User Interaction ───────────────────────────────────
    // The window is borderless (WS_POPUP), so Windows provides no drag
    // handle. We implement dragging manually with two distinct gestures:
    //
    //   • Drag ON the avatar → moves the avatar in 3D space (clamped to the
    //     visible screen, so it can't be dragged off the edges).
    //   • Drag on the background → moves the window (via goBridge_moveWindow).
    //
    // A press without movement counts as a tap (starts the conversation).

    const raycaster = new THREE.Raycaster();
    const _ndc = new THREE.Vector2();

    function eventNDC(e) {
      _ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
      _ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
      return _ndc;
    }

    // Returns the object to drag if the pointer is over the avatar, else null.
    function hitAvatar(e) {
      const avatarObj = vrm ? vrm.scene : (window._placeholder ? window._placeholder.group : null);
      if (!avatarObj) return null;

      raycaster.setFromCamera(eventNDC(e), camera);
      const hits = raycaster.intersectObject(avatarObj, true);
      return hits.length > 0 ? avatarObj : null;
    }

    // Clamp the avatar's base (x, y) so it always stays fully inside the
    // visible viewport. Uses the avatar's real measured extents (avatarBounds)
    // so the avatar can move all the way to the window edges without being
    // clipped — and can't be dragged past them.
    function clampAvatarBase() {
      const obj = vrm ? vrm.scene : (window._placeholder ? window._placeholder.group : null);
      if (!obj) return;

      // Perpendicular distance from the camera to the plane (through the
      // avatar, facing the camera) on which the avatar is dragged.
      const forward = camera.getWorldDirection(new THREE.Vector3());
      const toAvatar = new THREE.Vector3().subVectors(obj.position, camera.position);
      const depth = Math.max(toAvatar.dot(forward), 0.1);

      const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * depth;
      const halfW = halfH * camera.aspect;

      // How far the avatar extends horizontally from its center line, and how
      // far it extends up/down from its root. The root (avatarBase) sits at the
      // feet, so vertical bounds must leave the head below the top edge and the
      // feet above the bottom edge.
      const bodyHalfW = avatarBounds.halfW + avatarBounds.centerX;
      const bodyHalfWLeft = avatarBounds.halfW - avatarBounds.centerX;
      const headRoom = avatarBounds.top;   // head top above the root
      // If the mesh bottom is below the root (feet extend past root), keep
      // that clearance; otherwise the root itself is the lowest point.
      const footRoom = Math.max(0, -avatarBounds.bottom);

      const minX = -halfW + bodyHalfWLeft;
      const maxX = halfW - bodyHalfW;
      const minY = -halfH + footRoom;
      const maxY = halfH - headRoom;

      avatarBase.x = Math.min(Math.max(avatarBase.x, minX), maxX);
      avatarBase.y = Math.min(Math.max(avatarBase.y, minY), maxY);
    }

    // Move the avatar smoothly via WASD / arrow keys. Runs every frame so
    // holding a key glides the avatar; movement is in the camera-facing plane,
    // matching how dragging works. Diagonal movement is not normalized (it's
    // ~1.4x faster) — acceptable for this use case.
    function updateKeyboardMove(dt) {
      if (dragAvatar) return; // don't fight an active drag

      let dx = 0, dy = 0;
      if (keys.left)  dx -= 1;
      if (keys.right) dx += 1;
      if (keys.down)  dy -= 1;
      if (keys.up)    dy += 1;
      if (dx === 0 && dy === 0) return;

      avatarBase.x += dx * moveSpeed * dt;
      avatarBase.y += dy * moveSpeed * dt;
      clampAvatarBase();

      // Apply the new position immediately (idle micro-movement re-adds its
      // own offset on top of avatarBase each frame).
      const obj = vrm ? vrm.scene : (window._placeholder ? window._placeholder.group : null);
      if (obj) {
        obj.position.x = avatarBase.x;
        obj.position.y = avatarBase.y;
      }
    }

    // Determine (once) the drag plane and the avatar's offset from the grab
    // point, then on each move intersect the mouse ray with that plane.
    function startAvatarDrag(e, avatarObj) {
      const plane = new THREE.Plane();
      plane.setFromNormalAndCoplanarPoint(
        camera.getWorldDirection(new THREE.Vector3()),
        avatarObj.position
      );
      raycaster.setFromCamera(eventNDC(e), camera);
      const start = new THREE.Vector3();
      raycaster.ray.intersectPlane(plane, start);
      const offset = new THREE.Vector3().subVectors(avatarObj.position, start);

      dragAvatar = {
        plane,
        offset,
        prevX: e.clientX,
        prevY: e.clientY,
        avatarObj,
      };
    }

    function moveAvatarDrag(e) {
      raycaster.setFromCamera(eventNDC(e), camera);
      const point = new THREE.Vector3();
      if (!raycaster.ray.intersectPlane(dragAvatar.plane, point)) return;
      point.add(dragAvatar.offset);
      avatarBase.x = point.x;
      avatarBase.y = point.y;
      clampAvatarBase();
    }

    // Window-drag state (used only when the press landed on the background).
    let dragWindow = null; // { startX, startY, lastX, lastY, moved }

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // left button only

      const avatarObj = hitAvatar(e);
      if (avatarObj) {
        dragAvatar = null;
        startAvatarDrag(e, avatarObj);
        // Re-apply the avatar's position immediately so the idle sway does not
        // fight the drag while the pointer is held still.
        avatarBase.x = avatarObj.position.x;
        avatarBase.y = avatarObj.position.y;
        canvas.style.cursor = 'grabbing';
        e.preventDefault();
        return;
      }

      dragWindow = {
        startX: e.screenX,
        startY: e.screenY,
        lastX: e.screenX,
        lastY: e.screenY,
        moved: false,
      };
    });

    document.addEventListener('mousemove', (e) => {
      // Avatar drag.
      if (dragAvatar) {
        moveAvatarDrag(e);
        if (vrm) {
          vrm.scene.position.x = avatarBase.x;
          vrm.scene.position.y = avatarBase.y;
        } else if (window._placeholder) {
          window._placeholder.group.position.x = avatarBase.x;
          window._placeholder.group.position.y = avatarBase.y;
        }
        return;
      }

      // Window drag.
      if (!dragWindow) {
        // Hover cursor feedback: grab when over the avatar.
        canvas.style.cursor = hitAvatar(e) ? 'grab' : 'default';
        return;
      }

      const dx = e.screenX - dragWindow.lastX;
      const dy = e.screenY - dragWindow.lastY;

      // Ignore tiny jitter; only start dragging past a threshold so a
      // normal click still registers as a tap.
      if (!dragWindow.moved &&
          (Math.abs(e.screenX - dragWindow.startX) > 4 ||
           Math.abs(e.screenY - dragWindow.startY) > 4)) {
        dragWindow.moved = true;
      }

      if (dragWindow.moved && window.goBridge_moveWindow) {
        window.goBridge_moveWindow(dx, dy);
      }

      dragWindow.lastX = e.screenX;
      dragWindow.lastY = e.screenY;
    });

    document.addEventListener('mouseup', (e) => {
      if (dragAvatar) {
        dragAvatar = null;
        canvas.style.cursor = 'default';
        return;
      }

      if (!dragWindow) return;
      const wasDrag = dragWindow.moved;
      dragWindow = null;
      if (!wasDrag) {
        sendEvent('tap', {});
      }
    });

    document.addEventListener('keydown', (e) => {
      // Don't consume shortcuts when the user is typing in an input.
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        sendEvent('tap', {});
        return;
      }

      // WASD + arrow keys for avatar movement.
      switch (e.key) {
        case 'w': case 'W': case 'ArrowUp':    keys.up    = true; e.preventDefault(); break;
        case 's': case 'S': case 'ArrowDown':  keys.down  = true; e.preventDefault(); break;
        case 'a': case 'A': case 'ArrowLeft':  keys.left  = true; e.preventDefault(); break;
        case 'd': case 'D': case 'ArrowRight': keys.right = true; e.preventDefault(); break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.key) {
        case 'w': case 'W': case 'ArrowUp':    keys.up    = false; break;
        case 's': case 'S': case 'ArrowDown':  keys.down  = false; break;
        case 'a': case 'A': case 'ArrowLeft':  keys.left  = false; break;
        case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
      }
    });

    // ─── Resize Handler ─────────────────────────────────────
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      // Re-fit the camera so the avatar fills the (now different) window.
      fitCameraToWindow();
      clampAvatarBase();
      // Re-apply the (possibly clamped) base position.
      if (vrm) {
        vrm.scene.position.x = avatarBase.x;
        vrm.scene.position.y = avatarBase.y;
      } else if (window._placeholder) {
        window._placeholder.group.position.x = avatarBase.x;
        window._placeholder.group.position.y = avatarBase.y;
      }
    });

    // ─── Start ──────────────────────────────────────────────
    initAvatar().then(() => {
      animate();
    });
  </script>
</body>
</html>
