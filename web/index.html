<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar PC</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #canvas { display: block; cursor: default; }

    /* Loading overlay */
    .loading {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      color: rgba(255,255,255,0.6); font-size: 18px;
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div class="loading" id="loading">加载中...</div>
  
  <!-- All JS loaded locally (no CDN, for air-gapped deployment) -->
  <script type="importmap">
  {
    "imports": {
      "three": "./js/three.module.js",
      "three/addons/": "./js/addons/",
      "@pixiv/three-vrm": "./js/three-vrm.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    // ─── Globals ────────────────────────────────────────────
    let vrm = null;           // current VRM model
    let clock = new THREE.Clock();
    let currentMode = 'idle';
    let currentEmotion = 'neutral';
    let isSpeaking = false;
    let idleAnimEnabled = true;   // from cfg.yml avatar.idle_animations_enabled
    let idleAnimState = 'resting';  // 'resting' | 'playing'
    let idleAnimTimer = 0;          // elapsed time within current phase
    let idleAnimDuration = 0;       // total duration of current animation
    let idleRestDuration = 0;       // how long to rest before next anim
    let idleAnimIndex = -1;         // which animation is playing

    // Bones driven by the idle animation system. The normalized humanoid
    // bones rest at identity (= T-pose, arms horizontal); see setBone().
    const POSE_BONES = [
      'hips', 'spine', 'chest', 'upperChest', 'neck', 'head',
      'leftShoulder', 'leftUpperArm', 'leftLowerArm', 'leftHand',
      'rightShoulder', 'rightUpperArm', 'rightLowerArm', 'rightHand',
    ];

    // Viseme state (for smooth lerp)
    // VRM1 uses: aa, ih, ou, ee, oh (not A/I/U/E/O)
    let visemeTargets = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let visemeCurrent = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let visemeBlendSpeed = 30.0; // how fast visemes transition (snappy)

    // Blink state
    let blinkTimer = 0;
    let blinkInterval = 3.0;    // seconds between blinks
    let blinkValue = 0;
    // Blink phase: 'open' → 'closing' → 'closed' → 'opening' → 'open'
    let blinkPhase = 'open';

    // Idle micro-movement
    let idleTime = 0;

    // Avatar is always centered in the window. Movement is done by moving the
    // entire window (via goBridge_moveWindow), not by repositioning the avatar
    // within the window.
    const AVATAR_Y = -0.95;

    // Measured avatar world-space extents. Populated by fitWindowToAvatar()
    // once the model's bounding box is known.
    const avatarBounds = { worldW: 1.1, worldH: 1.7, worldCenter: new THREE.Vector3(0, 0.85, 0) };

    // Keyboard movement state — WASD + arrow keys → move the window.
    const keys = { left: false, right: false, up: false, down: false, ctrl: false };
    const winMoveSpeed = 250; // pixels per second

    // Orbit state — Ctrl + drag rotates the view around the avatar.
    // The camera orbits around avatarBounds.worldCenter (the avatar's pivot).
    let orbitActive = false;
    let orbitTheta = 0;     // horizontal angle (radians), 0 = look from front
    let orbitPhi = 0;       // vertical angle, positive = look from above
    let orbitDist = 3.5;    // distance from camera to pivot
    const orbitSpeed = 0.006; // radians per pixel of drag

    // ─── Three.js Setup ─────────────────────────────────────
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap; // soft-edged shadows
    renderer.toneMapping = THREE.NoToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0); // transparent — desktop shows through

    const scene = new THREE.Scene();
    // No background — transparent, desktop shows through.

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
    // Initial camera position — will be recomputed by fitWindowToAvatar() once
    // the avatar is loaded so the entire body (including legs) is visible.
    camera.position.set(0, 0.9, 3.5);
    camera.lookAt(0, 0.7, 0);

    // ─── Lighting ───────────────────────────────────────────
    // Ambient — keep it moderate so the material's base color is visible.
    scene.add(new THREE.AmbientLight('#ffffff', 0.8));

    // Key light (from upper-right-front) — the main light source.
    const keyLight = new THREE.DirectionalLight('#ffffff', 0.8);
    keyLight.position.set(1.5, 2.5, 2);
    keyLight.target.position.set(0, -0.5, 0); // aim at the avatar's body
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.1;
    keyLight.shadow.camera.far = 20;
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);
    scene.add(keyLight.target); // must add target to scene for .target to take effect

    // Fill light (from lower-left) — softens shadows without killing them.
    const fillLight = new THREE.DirectionalLight('#d0e8ff', 0.4);
    fillLight.position.set(-1, 0.3, -0.5);
    scene.add(fillLight);

    // Rim light (from behind and above) — creates a bright edge/contour
    // that separates the avatar from the background.
    const rimLight = new THREE.DirectionalLight('#ffffff', 0.3);
    rimLight.position.set(0.3, 1.5, -2.5);
    scene.add(rimLight);

    // ─── Ground: grid + shadow disc ─────────────────────────
    // The shadow disc is invisible but catches the avatar's shadow,
    // anchoring it to the "ground". The grid gives the 3D world reference
    // without blocking the desktop background.
    const groundY = AVATAR_Y; // y-level of the avatar's feet

    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(8, 48),
      new THREE.ShadowMaterial({ opacity: 0.3 })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.y = groundY;
    shadowDisc.receiveShadow = true;
    scene.add(shadowDisc);

    const gridHelper = new THREE.GridHelper(20, 40, 0x888888, 0xcccccc);
    gridHelper.position.y = groundY;
    gridHelper.material.opacity = 0.18;
    gridHelper.material.transparent = true;
    scene.add(gridHelper);

    // ─── Load VRM ───────────────────────────────────────────
    async function loadVRM(url) {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));

      const gltf = await loader.loadAsync(url);
      vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.removeUnnecessaryJoints(gltf.scene);
      VRMUtils.rotateVRM0(vrm);

      scene.add(vrm.scene);
      vrm.scene.position.set(0, -0.95, 0);

      // Enable shadow casting on all VRM meshes so the ground plane
      // can receive the avatar's shadow.
      vrm.scene.traverse((obj) => {
        if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; }
      });

      // Set the natural standing pose (arms down, fingers curled).
      // This is the default idle pose; animations drive bones from the
      // normalized T-pose (identity) baseline, and stopIdleAnimation()
      // restores this standing pose after each animation / turn.
      setArmPose();

      console.log('VRM loaded:', vrm.meta?.metaVersion);
      console.log('Expressions:', Object.keys(vrm.expressionManager?.expressionMap || {}));
      document.getElementById('loading').style.display = 'none';

      // Auto-fit the window to the avatar's bounding box so the entire body
      // (including legs) is visible.
      setTimeout(fitWindowToAvatar, 100);
    }

    // Rotate upper arms from T-pose (arms horizontal) to a natural hanging pose.
    function setArmPose() {
      if (!vrm?.humanoid) return;

      const leftUpperArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
      const rightUpperArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');

      // In the T-pose the arms extend horizontally along ±X (up = +Y, forward = +Z).
      // A rotation around the Z axis swings the arm in the vertical (XY) plane.
      //   left arm points +X → -90° about Z brings it down to -Y.
      //   right arm points -X → +90° about Z brings it down to -Y.
      // To splay the arms OUTWARD (away from the body midline) so the hands
      // aren't hidden behind the torso, subtract the outward angle from the
      // "down" rotation: left -90°+out moves toward +X (its own side),
      // right +90°-out moves toward -X (its own side).
      const armDown = Math.PI / 2;      // 90° down from horizontal
      const armOut = 0.22;              // outward splay (~12.6°)

      if (leftUpperArm) {
        leftUpperArm.rotation.set(0, 0, -(armDown - armOut));
      }
      if (rightUpperArm) {
        rightUpperArm.rotation.set(0, 0, armDown - armOut);
      }

      // Curl fingers into a natural relaxed pose.
      setFingerPose();
    }

    // Curl finger bones into a natural relaxed hand pose.
    // In a relaxed standing posture, fingers are slightly bent, not straight.
    // Each finger curls progressively — proximal bends least, distal bends most.
    function setFingerPose() {
      if (!vrm?.humanoid) return;

      const sides = ['left', 'right'];
      // Fingers: index, middle, ring, little — each has proximal, intermediate, distal.
      // Curl amount varies by finger: little curls most, index least.
      const fingerCurl = {
        index:  { proximal: 0.15, intermediate: 0.25, distal: 0.15 },
        middle: { proximal: 0.12, intermediate: 0.20, distal: 0.12 },
        ring:   { proximal: 0.18, intermediate: 0.28, distal: 0.18 },
        little: { proximal: 0.22, intermediate: 0.35, distal: 0.22 },
      };

      for (const side of sides) {
        // Left and right hands are mirror images: curling toward the palm
        // (toward the torso) is +Z on one hand and -Z on the other.
        const curlDir = side === 'left' ? -1 : 1;

        for (const [finger, angles] of Object.entries(fingerCurl)) {
          const cap = finger.charAt(0).toUpperCase() + finger.slice(1);
          const proximal = vrm.humanoid.getNormalizedBoneNode(side + cap + 'Proximal');
          const intermediate = vrm.humanoid.getNormalizedBoneNode(side + cap + 'Intermediate');
          const distal = vrm.humanoid.getNormalizedBoneNode(side + cap + 'Distal');

          // Curl around the local Z axis (bend toward palm).
          if (proximal)     proximal.rotation.z     = curlDir * angles.proximal;
          if (intermediate) intermediate.rotation.z = curlDir * angles.intermediate;
          if (distal)       distal.rotation.z       = curlDir * angles.distal;
        }

        // Thumb: metacarpal → proximal → intermediate → distal
        const thumbMeta  = vrm.humanoid.getNormalizedBoneNode(side + 'ThumbMetacarpal');
        const thumbProx  = vrm.humanoid.getNormalizedBoneNode(side + 'ThumbProximal');
        const thumbInter = vrm.humanoid.getNormalizedBoneNode(side + 'ThumbIntermediate');
        const thumbDist  = vrm.humanoid.getNormalizedBoneNode(side + 'ThumbDistal');

        // Thumb curls inward toward palm; metacarpal gets a small inward twist.
        if (thumbMeta)  thumbMeta.rotation.z  = curlDir * 0.10;
        if (thumbProx)  thumbProx.rotation.z  = curlDir * 0.15;
        if (thumbInter) thumbInter.rotation.z = curlDir * 0.10;
        if (thumbDist)  thumbDist.rotation.z  = curlDir * 0.08;
      }
    }

    // ─── Try to load a local VRM model, fallback to a simple placeholder ──
    async function initAvatar() {
      try {
        // Try loading a VRM model from the models/ directory.
        await loadVRM('/models/avatar.vrm');
      } catch (err) {
        console.error('VRM load failed:', err.message, err.stack);
        console.warn('Falling back to placeholder avatar...');
        createPlaceholderAvatar();
      }
    }

    // ─── Placeholder avatar (simple geometric character) ────
    function createPlaceholderAvatar() {
      const group = new THREE.Group();

      // Body (torso)
      const bodyGeo = new THREE.CapsuleGeometry(0.22, 0.5, 8, 16);
      const bodyMat = new THREE.MeshStandardMaterial({ color: '#4a6fa5', roughness: 0.3 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.75;
      body.castShadow = true;
      group.add(body);

      // Head
      const headGroup = new THREE.Group();
      headGroup.position.y = 1.25;

      const headGeo = new THREE.SphereGeometry(0.2, 32, 32);
      const headMat = new THREE.MeshStandardMaterial({ color: '#f5e6d3', roughness: 0.4 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.castShadow = true;
      headGroup.add(head);

      // Eyes
      const eyeGeo = new THREE.SphereGeometry(0.045, 16, 16);
      const eyeMat = new THREE.MeshStandardMaterial({ color: '#111111', roughness: 0.1 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.07, 0.04, -0.17);
      headGroup.add(leftEye);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.07, 0.04, -0.17);
      headGroup.add(rightEye);

      // Mouth
      const mouthGeo = new THREE.BoxGeometry(0.1, 0.02, 0.01);
      const mouthMat = new THREE.MeshStandardMaterial({ color: '#cc4444', roughness: 0.3 });
      const mouth = new THREE.Mesh(mouthGeo, mouthMat);
      mouth.position.set(0, -0.06, -0.18);
      mouth.name = 'mouth';
      headGroup.add(mouth);

      group.add(headGroup);
      group.position.set(0, -0.95, 0);
      scene.add(group);

      // Store references for animation
      window._placeholder = { group, headGroup, mouth, leftEye, rightEye };

      console.log('Placeholder avatar created');
      document.getElementById('loading').style.display = 'none';

      // Auto-fit the window to the avatar's bounding box.
      setTimeout(fitWindowToAvatar, 100);
    }

    // ─── Auto-fit window to avatar bounding box ─────────────────
    // Measures the avatar's bounding box, then resizes the window so the
    // avatar's on-screen height equals half the screen height.  The window
    // aspect ratio matches the avatar's width/height ratio.
    function fitWindowToAvatar() {
      const box = new THREE.Box3();
      scene.traverse((obj) => {
        // Skip the ground helpers — they're huge and would distort the bbox.
        if (!obj.isMesh || obj === shadowDisc || obj === gridHelper) return;
        box.expandByObject(obj);
      });
      if (box.isEmpty()) return;

      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);

      console.log('avatar world bbox:', size.x.toFixed(2), 'x', size.y.toFixed(2),
                  'center:', center.x.toFixed(2), center.y.toFixed(2), center.z.toFixed(2));

      // Store world-space extents for camera fit.
      avatarBounds.worldW = size.x;
      avatarBounds.worldH = size.y;
      avatarBounds.worldCenter.copy(center);

      // Target: avatar height = half the screen height.
      // The window height is set to the target avatar pixel height; the
      // camera fit (fitCameraToWindow) adds a small margin internally so
      // the avatar doesn't touch the window edges.
      const targetPxH = Math.round(screen.height * 0.5);
      const winH = targetPxH;
      // Square window — width follows the avatar height, not the avatar
      // width, so the avatar has room to rotate (Ctrl+drag) and the grid
      // extends on both sides without clipping.
      const winW = winH;

      console.log('fitWindowToAvatar: target px height:', targetPxH,
                  'window:', winW, 'x', winH);

      // Tell Go to resize + center the window, then fit the camera.
      if (window.goBridge_setWindowSize) {
        window.goBridge_setWindowSize(winW, winH);
      }
      // Defer camera fit to next frame — the window may not have resized yet.
      setTimeout(fitCameraToWindow, 50);
    }

    // Adjusts the camera distance so the avatar fills the current window,
    // keeping the same margin. Called on resize and after initial window fit.
    function fitCameraToWindow() {
      if (!avatarBounds.worldH) return;

      const margin = 1.02;
      const fovRad = camera.fov * Math.PI / 180;

      const distH = (avatarBounds.worldW * margin) / (2 * Math.tan(fovRad / 2) * camera.aspect);
      const distV = (avatarBounds.worldH * margin) / (2 * Math.tan(fovRad / 2));
      const dist = Math.max(distH, distV);

      orbitDist = dist;
      camera.near = Math.max(0.01, dist * 0.1);
      camera.updateProjectionMatrix();
      updateOrbitCamera(); // uses current orbitTheta/orbitPhi/orbitDist

      console.log('fitCameraToWindow: dist:', dist.toFixed(1),
                  'pos:', camera.position.x.toFixed(2), camera.position.y.toFixed(2));
    }

    // ─── Animation Loop ─────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);

      const dt = Math.min(clock.getDelta(), 0.1);
      idleTime += dt;

      // Update orbit camera position from spherical coords.
      updateOrbitCamera();

      if (vrm) {
        // Update VRM
        updateVRMBlink(dt);
        updateVRMVisemes(dt);
        updateVRMIdleMicro(dt);
        // Idle animation system — runs when idle and idleAnimEnabled is true.
        if (currentMode === 'idle') updateIdleAnimation(dt);
        updateWindowMove(dt);

        // VRM needs to be updated each frame for expressions to apply
        vrm.update(dt);
      } else if (window._placeholder) {
        updatePlaceholderBlink(dt);
        updatePlaceholderMouth(dt);
        updatePlaceholderIdle(dt);
        updateWindowMove(dt);
      }

      renderer.render(scene, camera);
    }

    // ─── Orbit camera ──────────────────────────────────────
    // Recomputes the camera position from the spherical orbit
    // coordinates (theta, phi, dist) around the avatar center.
    function updateOrbitCamera() {
      const center = avatarBounds.worldCenter;
      const sp = Math.sin(orbitPhi);
      const cp = Math.cos(orbitPhi);
      const st = Math.sin(orbitTheta);
      const ct = Math.cos(orbitTheta);

      camera.position.set(
        center.x + orbitDist * cp * st,
        center.y + orbitDist * sp,
        center.z + orbitDist * cp * ct
      );
      camera.lookAt(center.x, center.y, center.z);
    }

    // ─── VRM: Blink ─────────────────────────────────────────
    function updateVRMBlink(dt) {
      // Apply blink (VRM1 preset name is 'blink') every frame.
      if (vrm.expressionManager && blinkValue > 0.001) {
        vrm.expressionManager.setValue('blink', blinkValue);
      }

      // Waiting for the next blink.
      if (blinkPhase === 'open') {
        blinkTimer += dt;
        if (blinkTimer > blinkInterval) {
          blinkPhase = 'closing';
          blinkTimer = 0;
          blinkInterval = 2.5 + Math.random() * 4.0;
        }
        return;
      }

      if (blinkPhase === 'closing') {
        blinkValue += dt * 12; // fast close
        if (blinkValue >= 1.0) {
          blinkValue = 1.0;
          blinkPhase = 'closed';
          blinkTimer = 0;
        }
        return;
      }

      if (blinkPhase === 'closed') {
        blinkTimer += dt;
        if (blinkTimer > 0.12) {
          blinkPhase = 'opening';
        }
        return;
      }

      if (blinkPhase === 'opening') {
        blinkValue -= dt * 12; // open
        if (blinkValue <= 0) {
          blinkValue = 0;
          blinkPhase = 'open';
          blinkTimer = 0;
        }
        return;
      }
    }

    // ─── VRM: Viseme (lip-sync) ─────────────────────────────
    function updateVRMVisemes(dt) {
      if (!vrm?.expressionManager) return;

      const visemeNames = ['aa', 'ih', 'ou', 'ee', 'oh'];
      const lerp = Math.min(visemeBlendSpeed * dt, 1.0);

      for (const name of visemeNames) {
        visemeCurrent[name] += (visemeTargets[name] - visemeCurrent[name]) * lerp;
        vrm.expressionManager.setValue(name, visemeCurrent[name]);
      }
    }

    // ─── VRM: Idle micro-movement ───────────────────────────
    function updateVRMIdleMicro(dt) {
      if (currentMode !== 'idle') return;
      if (!vrm?.scene) return;
      // If a procedural idle animation is playing, skip the default micro-movement
      // so the two don't fight each other.
      if (idleAnimEnabled && idleAnimState === 'playing') return;

      const t = idleTime;
      // Subtle breathing (layered on top of the fixed root height)
      const breathe = Math.sin(t * 1.4) * 0.008;
      vrm.scene.position.y = AVATAR_Y + breathe;
      // Subtle side-to-side sway
      vrm.scene.position.x = Math.sin(t * 0.7) * 0.015;
      vrm.scene.rotation.z = Math.sin(t * 0.7) * 0.015;
      // Gentle body turn so the side profile is occasionally visible —
      // this is what makes the 3D volume read as "solid" rather than flat.
      vrm.scene.rotation.y = Math.sin(t * 0.4) * 0.18;

      // Keep the mouth slightly parted in idle so it's always visible.
      // A natural resting expression has the lips just barely apart.
      // This tiny 'aa' viseme (4-5% weight) is enough to show the mouth
      // geometry without looking like the avatar is talking.
      visemeTargets['aa'] = 0.04 + Math.sin(t * 1.4) * 0.01;
    }

    // ─── VRM: Idle Animation System ─────────────────────────
    // 12 procedural animations that play randomly when the avatar is idle.
    //
    // Key design decision: animations are authored relative to the normalized
    // bone rest pose (identity = T-pose, arms horizontal).  startIdleAnimation()
    // resets all bones to identity before playing, so each animation frame knows
    // its exact starting point.  stopIdleAnimation() restores the natural standing
    // pose (arms down, fingers curled) via setArmPose().

    // Helper: get a bone node safely, returning null if missing.
    function getBone(name) {
      if (!vrm?.humanoid) return null;
      return vrm.humanoid.getNormalizedBoneNode(name);
    }

    // Helper: reset the pose bones to their normalized rest (identity = T-pose).
    function resetPoseBones() {
      for (const name of POSE_BONES) {
        const b = getBone(name);
        if (b) b.quaternion.identity();
      }
    }

    // Helper: set a bone's rotation from the normalized T-pose baseline.
    // @pixiv/three-vrm normalizes humanoid bones so their rest rotation is
    // identity (= T-pose, arms horizontal). So the local quaternion is just
    // the Euler rotation we want — no rest-pose multiply needed.
    function setBone(name, rx, ry, rz) {
      const b = getBone(name);
      if (!b) return;
      b.quaternion.setFromEuler(new THREE.Euler(rx, ry, rz, 'YXZ'));
    }

    // ─── 12 Idle Animations ─────────────────────────────────
    // Each animation fn(t) writes bone rotations.  t is seconds since the
    // animation started.  All angles are relative to the normalized T-pose
    // (identity = arms horizontal), because startIdleAnimation() resets every
    // bone to identity before playing.  stopIdleAnimation() restores the
    // natural standing pose (arms down, fingers curled).

    // 0: T-Pose — hold the model's original T-pose (identity).
    function animTPose(t) {
      // bones are already identity from startIdleAnimation() reset
    }

    // 1: Bored — head tilt, one hand on hip, slight slouch.
    function animBored(t) {
      setBone('spine', 0.15, 0, 0);
      setBone('neck', 0, 0, -0.3);
      setBone('head', 0.1, 0, -0.15 + Math.sin(t * 2.0) * 0.05);
      // Right hand on hip: raise upper arm out and bend elbow.
      setBone('rightUpperArm', 0, 0, 0.8);
      setBone('rightLowerArm', 0, 0, 0.6);
      setBone('rightHand', 0, 0, 0.3);
      // Left arm hangs with slight sway.
      setBone('leftUpperArm', 0, 0, -1.3 + Math.sin(t * 1.2) * 0.04);
      setBone('leftLowerArm', 0, 0, -0.2);
      if (vrm.scene) vrm.scene.position.y = AVATAR_Y + Math.sin(t * 0.8) * 0.01;
    }

    // 2: Cross Jumps — small hops with arms crossing.
    function animCrossJumps(t) {
      const jumpHeight = Math.abs(Math.sin(t * 8.0)) * 0.06;
      if (vrm.scene) vrm.scene.position.y = AVATAR_Y + jumpHeight;

      const cross = Math.sin(t * 4.0) * 0.6;
      setBone('leftUpperArm', 0, 0, -1.2 + cross);
      setBone('rightUpperArm', 0, 0, 1.2 - cross);
      setBone('leftLowerArm', 0, 0, -0.4);
      setBone('rightLowerArm', 0, 0, 0.4);
    }

    // 3: Fight Idle — boxer stance, weight shifting side to side.
    function animFightIdle(t) {
      setBone('spine', 0.2, 0, 0);
      setBone('head', 0.15, 0, 0);
      // Fists up in guard.
      setBone('leftUpperArm', 0, 0, -1.0);
      setBone('leftLowerArm', 0, 0, -0.8);
      setBone('leftHand', 0, 0, 0.2);
      setBone('rightUpperArm', 0, 0, 1.0);
      setBone('rightLowerArm', 0, 0, 0.8);
      setBone('rightHand', 0, 0, -0.2);
      // Weight shift.
      const shift = Math.sin(t * 2.5) * 0.04;
      if (vrm.scene) {
        vrm.scene.position.x = shift;
        vrm.scene.rotation.z = shift * 0.5;
      }
    }

    // 4: Jumping Rope — wrists circle, small regular hops.
    function animJumpingRope(t) {
      // Arms out to sides, elbows bent.
      setBone('leftUpperArm', 0, 0.3, -0.9);
      setBone('leftLowerArm', 0, 0, -0.5);
      setBone('rightUpperArm', 0, -0.3, 0.9);
      setBone('rightLowerArm', 0, 0, 0.5);
      // Wrist circles.
      const wristAngle = t * 12.0;
      setBone('leftHand', 0, Math.sin(wristAngle) * 0.5, Math.cos(wristAngle) * 0.5);
      setBone('rightHand', 0, Math.sin(wristAngle) * 0.5, -Math.cos(wristAngle) * 0.5);
      // Regular hops.
      if (vrm.scene) vrm.scene.position.y = AVATAR_Y + Math.abs(Math.sin(t * 7.0)) * 0.04;
    }

    // 5: Looking — head turns to one side, body leans slightly.
    function animLooking(t) {
      setBone('head', 0, 0.6 + Math.sin(t * 1.5) * 0.05, 0.1);
      setBone('neck', 0, 0.3, 0);
      setBone('chest', 0, 0.15, 0);
      if (vrm.scene) vrm.scene.rotation.z = 0.02;
    }

    // 6: Looking Around — head sweeps left and right slowly.
    function animLookingAround(t) {
      const sweep = Math.sin(t * 0.8) * 0.7;
      setBone('head', 0, sweep, 0);
      setBone('neck', 0, sweep * 0.5, 0);
    }

    // 7: Magic Spell Casting — one hand raised, drawing circles in the air.
    function animMagicSpellCasting(t) {
      setBone('spine', -0.1, 0, 0);
      setBone('head', -0.05, 0, 0);
      // Right arm raised forward.
      setBone('rightUpperArm', -0.6, 0, 0.8);
      setBone('rightLowerArm', 0, 0, 0.4);
      // Right hand draws circles.
      const circleAngle = t * 3.0;
      setBone('rightHand', Math.sin(circleAngle) * 0.3, Math.cos(circleAngle) * 0.3, 0);
      // Left arm slightly out for balance.
      setBone('leftUpperArm', 0, 0, -0.5);
      setBone('leftLowerArm', 0, 0, -0.3);
    }

    // 8: Offensive Idle — aggressive stance, weight shifting, fists up.
    function animOffensiveIdle(t) {
      setBone('spine', 0.25, 0, 0);
      setBone('chest', 0.1, 0, 0);
      setBone('head', 0.2, 0, 0);
      setBone('leftUpperArm', -0.3, 0, -0.5);
      setBone('leftLowerArm', 0, 0, -0.6);
      setBone('leftHand', 0, 0, 0.1);
      setBone('rightUpperArm', -0.3, 0, 0.5);
      setBone('rightLowerArm', 0, 0, 0.6);
      setBone('rightHand', 0, 0, -0.1);
      const shift = Math.sin(t * 3.5) * 0.05;
      if (vrm.scene) {
        vrm.scene.position.x = shift;
        vrm.scene.rotation.z = shift * 0.6;
        vrm.scene.position.y = AVATAR_Y + Math.abs(Math.sin(t * 3.5 + 0.5)) * 0.015;
      }
    }

    // 9: Searching Files High — both arms raised, hands shuffling overhead.
    function animSearchingFilesHigh(t) {
      setBone('head', -0.3, 0, 0);
      setBone('spine', -0.15, 0, 0);
      setBone('leftUpperArm', -1.4, 0, -0.8);
      setBone('leftLowerArm', 0, 0, -0.3);
      setBone('rightUpperArm', -1.4, 0, 0.8);
      setBone('rightLowerArm', 0, 0, 0.3);
      const shuffle = Math.sin(t * 4.0) * 0.3;
      setBone('leftHand', 0, shuffle, 0);
      setBone('rightHand', 0, -shuffle, 0);
    }

    // 10: Standing Magic Attack — one hand thrust forward, body leans into it.
    function animStandingMagicAttack(t) {
      setBone('spine', 0.2, 0, 0);
      setBone('chest', 0.1, 0, 0);
      setBone('head', 0.1, 0, 0);
      const thrust = Math.sin(t * 3.5) * 0.3;
      setBone('rightUpperArm', -0.5 + thrust * 0.2, 0, 0.6);
      setBone('rightLowerArm', 0, 0, 0.2);
      setBone('rightHand', 0, 0, Math.sin(t * 3.5) * 0.3);
      setBone('leftUpperArm', 0, 0, -0.5);
      setBone('leftLowerArm', 0, 0, -0.4);
      if (vrm.scene) {
        vrm.scene.position.y = AVATAR_Y + Math.abs(Math.sin(t * 3.5)) * 0.02;
        vrm.scene.rotation.x = Math.sin(t * 3.5) * 0.03;
      }
    }

    // 11: Texting While Standing — head down looking at phone, thumbs moving.
    function animTextingWhileStanding(t) {
      setBone('head', 0.5, 0, 0);
      setBone('neck', 0.25, 0, 0);
      setBone('spine', 0.2, 0, 0);
      setBone('leftUpperArm', 0.5, 0, -0.6);
      setBone('leftLowerArm', 0, 0, -0.7);
      setBone('rightUpperArm', 0.5, 0, 0.6);
      setBone('rightLowerArm', 0, 0, 0.7);
      setBone('leftHand', 0, Math.sin(t * 6.0) * 0.4, 0);
      setBone('rightHand', 0, Math.cos(t * 5.5) * 0.4, 0);
    }

    // Animation registry: name → function(t, dt)
    const idleAnimations = [
      { name: 'T-Pose',                fn: animTPose,                duration: 3.5 },
      { name: 'Bored',                 fn: animBored,                duration: 5.0 },
      { name: 'Cross Jumps',           fn: animCrossJumps,           duration: 4.0 },
      { name: 'Fight Idle',            fn: animFightIdle,            duration: 4.5 },
      { name: 'Jumping Rope',          fn: animJumpingRope,          duration: 4.0 },
      { name: 'Looking',               fn: animLooking,              duration: 3.5 },
      { name: 'Looking Around',        fn: animLookingAround,        duration: 4.0 },
      { name: 'Magic Spell Casting',   fn: animMagicSpellCasting,    duration: 5.0 },
      { name: 'Offensive Idle',        fn: animOffensiveIdle,        duration: 4.5 },
      { name: 'Searching Files High',  fn: animSearchingFilesHigh,   duration: 4.5 },
      { name: 'Standing Magic Attack', fn: animStandingMagicAttack,  duration: 4.0 },
      { name: 'Texting While Standing',fn: animTextingWhileStanding,  duration: 5.0 },
    ];

    // Pick a random idle animation (different from the current one).
    function pickRandomIdleAnimation() {
      let idx;
      do {
        idx = Math.floor(Math.random() * idleAnimations.length);
      } while (idx === idleAnimIndex && idleAnimations.length > 1);
      return idx;
    }

    // Start a new idle animation.
    function startIdleAnimation() {
      if (!idleAnimEnabled || !vrm) return;
      // Reset every pose bone to the normalized T-pose (identity) so the
      // animation's euler angles are applied from a known baseline.
      resetPoseBones();
      idleAnimIndex = pickRandomIdleAnimation();
      idleAnimDuration = idleAnimations[idleAnimIndex].duration;
      idleAnimTimer = 0;
      idleAnimState = 'playing';
    }

    // Restore the natural standing pose (arms down, fingers curled) and reset
    // the scene transform left over from micro-movement / animations.  Called
    // when an idle animation ends and whenever we leave idle mode (start of a
    // conversation turn).
    function resetToStandingPose() {
      setArmPose();
      if (vrm.scene) {
        vrm.scene.position.set(0, AVATAR_Y, 0);
        vrm.scene.rotation.set(0, 0, 0);
      }
    }

    // Stop the current idle animation and restore the natural standing pose.
    function stopIdleAnimation() {
      if (idleAnimState === 'playing') {
        resetToStandingPose();
      }
      idleAnimState = 'resting';
      idleAnimTimer = 0;
      idleAnimIndex = -1;
      // Pick a random rest duration between 2 and 5 seconds.
      idleRestDuration = 2.0 + Math.random() * 3.0;
    }

    // Called every frame when the avatar is idle. Manages the rest/play cycle.
    function updateIdleAnimation(dt) {
      if (!idleAnimEnabled || !vrm) return;

      if (idleAnimState === 'resting') {
        idleAnimTimer += dt;
        if (idleAnimTimer >= idleRestDuration) {
          startIdleAnimation();
        }
      } else if (idleAnimState === 'playing') {
        idleAnimTimer += dt;
        if (idleAnimTimer >= idleAnimDuration) {
          stopIdleAnimation();
        } else {
          const anim = idleAnimations[idleAnimIndex];
          if (anim) anim.fn(idleAnimTimer);
        }
      }
    }

    // ─── Placeholder: Blink ─────────────────────────────────
    let placeholderBlink = 0;
    let placeholderBlinkPhase = 'open';
    let placeholderBlinkTimer = 0;

    function updatePlaceholderBlink(dt) {
      const { leftEye, rightEye } = window._placeholder;

      if (placeholderBlinkPhase === 'open') {
        placeholderBlinkTimer += dt;
        if (placeholderBlinkTimer > 3.0) {
          placeholderBlinkPhase = 'closing';
          placeholderBlinkTimer = 0;
        }
        return;
      }

      if (placeholderBlinkPhase === 'closing') {
        placeholderBlink += dt * 10;
        if (placeholderBlink >= 1.0) {
          placeholderBlink = 1.0;
          placeholderBlinkPhase = 'closed';
          placeholderBlinkTimer = 0;
        }
        return;
      }

      if (placeholderBlinkPhase === 'closed') {
        placeholderBlinkTimer += dt;
        if (placeholderBlinkTimer > 0.15) {
          placeholderBlinkPhase = 'opening';
        }
        return;
      }

      if (placeholderBlinkPhase === 'opening') {
        placeholderBlink -= dt * 10;
        if (placeholderBlink <= 0) {
          placeholderBlink = 0;
          placeholderBlinkPhase = 'open';
          placeholderBlinkTimer = 0;
        }
        return;
      }

      const eyeScale = 1 - placeholderBlink * 0.9;
      leftEye.scale.y = eyeScale;
      rightEye.scale.y = eyeScale;
    }

    // ─── Placeholder: Mouth (speaking) ───────────────────────
    let placeholderMouthTime = 0;
    function updatePlaceholderMouth(dt) {
      const { mouth } = window._placeholder;
      if (!mouth) return;

      if (isSpeaking) {
        placeholderMouthTime += dt;
        // Simple oscillating mouth open/close while speaking
        const openness = 0.5 + 0.5 * Math.sin(placeholderMouthTime * 12);
        mouth.scale.y = 0.3 + openness * 8;
        mouth.position.y = -0.06 - openness * 0.04;
      } else {
        mouth.scale.y = 0.3;
        mouth.position.y = -0.06;
      }
    }

    // ─── Placeholder: Idle sway ──────────────────────────────
    function updatePlaceholderIdle(dt) {
      if (currentMode !== 'idle') return;
      const { group } = window._placeholder;
      if (!group) return;
      const t = idleTime;
      group.position.y = AVATAR_Y + Math.sin(t * 1.4) * 0.005;
      group.position.x = Math.sin(t * 0.7) * 0.01;
      group.rotation.z = Math.sin(t * 0.7) * 0.01;
    }

    // ─── JS Bridge: Receive messages from Go ─────────────────
    // Called by Go via Eval: handleMessage(jsonString)
    window.handleMessage = function(jsonStr) {
      try {
        const msg = JSON.parse(jsonStr);
        if (msg.type === 'viseme') {
          // Viseme lip-sync message
          applyViseme(msg.viseme, msg.weight);
          return;
        }
        if (msg.mode) {
          currentMode = msg.mode;
          isSpeaking = msg.isSpeaking || false;
          if (msg.emotion) currentEmotion = msg.emotion;
          if (typeof msg.idleAnimationsEnabled === 'boolean') {
            idleAnimEnabled = msg.idleAnimationsEnabled;
          }
          // Leaving idle: stop any in-progress animation and reset the
          // standing pose (micro-movement may have left scene transforms).
          if (currentMode !== 'idle') {
            stopIdleAnimation();
            resetToStandingPose();
          }
          applyModeToVRM();
        }
      } catch (e) {
        console.error('handleMessage error:', e);
      }
    };

    // ─── Apply a single viseme to the VRM model ──────────────
    function applyViseme(viseme, weight) {
      if (!vrm?.expressionManager) return;

      // VRM1 mouth visemes: aa, ih, ou, ee, oh
      const mouthVisemes = ['aa', 'ih', 'ou', 'ee', 'oh'];

      if (viseme === 'rest' || !viseme) {
        // Reset all visemes (closed mouth).
        for (const name of mouthVisemes) {
          visemeTargets[name] = 0;
        }
        return;
      }

      // Set the target viseme to the given weight, others to 0.
      for (const name of mouthVisemes) {
        visemeTargets[name] = (name === viseme) ? weight : 0;
      }
    }

    // ─── Apply mode/emotion/speaking state to VRM ──────────────
    function applyModeToVRM() {
      if (!vrm?.expressionManager) return;

      // Reset all preset expressions to neutral
      const presets = ['happy', 'angry', 'sad', 'surprised', 'relaxed', 'neutral'];
      for (const p of presets) {
        vrm.expressionManager.setValue(p, 0);
      }

      // Apply emotion — but only when NOT speaking. The 'happy' (and most
      // other emotion) presets set overrideMouth='blend', which at weight 1.0
      // locks the mouth into the emotion's shape and blocks viseme lip-sync.
      // While speaking we keep emotion at 0 so the mouth follows the visemes.
      if (!isSpeaking && currentEmotion !== 'neutral' && presets.includes(currentEmotion)) {
        vrm.expressionManager.setValue(currentEmotion, 1.0);
      }

      // Visemes are driven by real-time viseme messages from Go,
      // not by the mode/emotion state. When not speaking, reset
      // the mouth to closed.
      if (!isSpeaking) {
        applyViseme('rest', 0);
      }
    }

    // ─── JS Bridge: Send events to Go ───────────────────────
    function sendEvent(type, data) {
      const msg = JSON.stringify({ type, data });
      // WebView2 bridge (bound by renderer_windows.go via w.Bind).
      if (window.goBridge_sendEvent) {
        window.goBridge_sendEvent(msg);
      }
      console.log('sendEvent:', type, data);
    }

    // ─── User Interaction ───────────────────────────────────
    // The window is borderless (WS_POPUP), so Windows provides no drag
    // handle. All dragging moves the window; the avatar stays fixed in the
    // center of the window. A press without movement counts as a tap (starts
    // the conversation).

    const raycaster = new THREE.Raycaster();
    const _ndc = new THREE.Vector2();

    function eventNDC(e) {
      _ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
      _ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
      return _ndc;
    }

    // Returns true if the pointer is over the avatar mesh.
    function hitAvatar(e) {
      const avatarObj = vrm ? vrm.scene : (window._placeholder ? window._placeholder.group : null);
      if (!avatarObj) return false;

      raycaster.setFromCamera(eventNDC(e), camera);
      const hits = raycaster.intersectObject(avatarObj, true);
      return hits.length > 0;
    }

    // Move the window smoothly via WASD / arrow keys. Runs every frame so
    // holding a key glides the window across the screen.
    function updateWindowMove(dt) {
      let dx = 0, dy = 0;
      if (keys.left)  dx -= 1;
      if (keys.right) dx += 1;
      if (keys.down)  dy += 1;
      if (keys.up)    dy -= 1;
      if (dx === 0 && dy === 0) return;

      const px = Math.round(dx * winMoveSpeed * dt);
      const py = Math.round(dy * winMoveSpeed * dt);
      if (px !== 0 || py !== 0) {
        if (window.goBridge_moveWindow) {
          window.goBridge_moveWindow(px, py);
        }
      }
    }

    // Drag = orbit camera around avatar. Ctrl+drag = move window.
    // { startX, startY, lastX, lastY, moved, isOrbit }
    let dragWindow = null;

    document.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // left button only

      // Ctrl+drag → move the window. Plain drag → orbit.
      const isOrbit = !keys.ctrl;
      dragWindow = {
        startX: e.screenX,
        startY: e.screenY,
        lastX: e.screenX,
        lastY: e.screenY,
        moved: false,
        isOrbit,
      };
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragWindow) {
        // Hover cursor: grab when over the avatar (drag to orbit).
        canvas.style.cursor = hitAvatar(e) ? 'grab' : 'default';
        return;
      }

      const dx = e.screenX - dragWindow.lastX;
      const dy = e.screenY - dragWindow.lastY;

      // Ignore tiny jitter; only start dragging past a threshold so a
      // normal click still registers as a tap.
      if (!dragWindow.moved &&
          (Math.abs(e.screenX - dragWindow.startX) > 4 ||
           Math.abs(e.screenY - dragWindow.startY) > 4)) {
        dragWindow.moved = true;
      }

      if (dragWindow.moved) {
        if (dragWindow.isOrbit) {
          // Plain drag: orbit the camera around the avatar.
          orbitTheta -= dx * orbitSpeed;
          orbitPhi += dy * orbitSpeed;
          // Clamp vertical angle so the camera doesn't flip.
          orbitPhi = Math.max(-1.4, Math.min(1.4, orbitPhi));
        } else if (window.goBridge_moveWindow) {
          // Ctrl+drag: move the window.
          window.goBridge_moveWindow(dx, dy);
        }
      }

      dragWindow.lastX = e.screenX;
      dragWindow.lastY = e.screenY;
    });

    document.addEventListener('mouseup', (e) => {
      if (!dragWindow) return;
      const wasDrag = dragWindow.moved;
      const wasOrbit = dragWindow.isOrbit;
      dragWindow = null;
      canvas.style.cursor = 'default';
      if (!wasDrag && !wasOrbit) {
        sendEvent('tap', {});
      }
    });

    document.addEventListener('keydown', (e) => {
      // Don't consume shortcuts when the user is typing in an input.
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        sendEvent('tap', {});
        return;
      }

      // WASD + arrow keys for window movement.
      switch (e.key) {
        case 'w': case 'W': case 'ArrowUp':    keys.up    = true; e.preventDefault(); break;
        case 's': case 'S': case 'ArrowDown':  keys.down  = true; e.preventDefault(); break;
        case 'a': case 'A': case 'ArrowLeft':  keys.left  = true; e.preventDefault(); break;
        case 'd': case 'D': case 'ArrowRight': keys.right = true; e.preventDefault(); break;
        case 'Control': keys.ctrl = true; break;
      }
    });

    document.addEventListener('keyup', (e) => {
      switch (e.key) {
        case 'w': case 'W': case 'ArrowUp':    keys.up    = false; break;
        case 's': case 'S': case 'ArrowDown':  keys.down  = false; break;
        case 'a': case 'A': case 'ArrowLeft':  keys.left  = false; break;
        case 'd': case 'D': case 'ArrowRight': keys.right = false; break;
        case 'Control': keys.ctrl = false; break;
      }
    });

    // ─── Resize Handler ─────────────────────────────────────
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      // Re-fit the camera so the avatar fills the (now different) window.
      fitCameraToWindow();
      // Restore the avatar to its fixed center position.
      if (vrm) {
        vrm.scene.position.set(0, AVATAR_Y, 0);
      } else if (window._placeholder) {
        window._placeholder.group.position.set(0, AVATAR_Y, 0);
      }
    });

    // ─── Start ──────────────────────────────────────────────
    initAvatar().then(() => {
      // Signal to Go that we're ready to receive state messages.
      sendEvent('ready', {});
      animate();
    });
  </script>
</body>
</html>
